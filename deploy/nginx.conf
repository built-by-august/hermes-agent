# nginx config for the Custom Hermes Agent webapp static build.
# - serves the SPA (with history-API fallback for client-side routing)
# - reverse-proxies /api/v1/* to the API service (set API_UPSTREAM)

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed static assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Reverse proxy the API. The upstream is injected at container start via
  # the API_UPSTREAM env var (default: http://api:4000).
  location /api/v1/ {
    proxy_pass ${API_UPSTREAM}/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_headers on;
  }

  # SPA fallback: any non-asset, non-api route returns index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
