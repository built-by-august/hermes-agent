apiVersion: v1
kind: Secret
metadata:
  name: custom-hermes-secrets
  namespace: custom-hermes
  labels:
    app.kubernetes.io/part-of: custom-hermes-agent
type: Opaque
# Values below are PLACEHOLDERS. Generate real ones and apply before deploy:
#   kubectl -n custom-hermes create secret generic custom-hermes-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
stringData:
  JWT_SECRET: 'REPLACE_WITH_32_BYTE_HEX'
  POSTGRES_PASSWORD: 'REPLACE_WITH_STRONG_PASSWORD'
